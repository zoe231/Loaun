kind = "api"
previewPath = "/bot"
title = "Loaun Bot"
version = "1.0.0"
id = "discord-bot-loaun-001"

[[services]]
localPort = 3000
name = "Loaun Discord Bot"
paths = ["/bot"]

[services.development]
run = "BASE_PATH=/bot pnpm --filter @workspace/discord-bot run dev"

[services.production]

[services.production.run]
args = ["node", "artifacts/discord-bot/src/app.js"]

[services.production.run.env]
PORT = "3000"
BASE_PATH = "/bot"
NODE_ENV = "production"
